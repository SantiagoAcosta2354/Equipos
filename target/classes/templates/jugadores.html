<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Jugadores')}"></head>
<body>

<div th:replace="~{fragmentos :: nav}"></div>

<main class="container">

	<h1 class="h3 mb-3">Jugadores</h1>

	<div class="row g-4">

		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Jugadores registrados</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr><th>Id</th><th>Nombre</th><th>Número</th><th>Posición</th><th></th></tr>
						</thead>
						<tbody>
							<tr th:each="j : ${jugadores}">
								<td th:text="${j.id}">1</td>
								<td class="fw-semibold" th:text="${j.nombre + ' ' + j.apellido}">Nombre</td>
								<td th:text="${j.numero}">10</td>
								<td th:text="${j.posicion}">Delantero</td>
								<td class="text-end">
									<form th:action="@{/jugadores/eliminar/{id}(id=${j.id})}"
										method="post"
										onsubmit="return confirm('¿Eliminar este jugador?');">
										<button class="btn btn-sm btn-outline-danger">Eliminar</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="card-body py-3" th:if="${#lists.isEmpty(jugadores)}">
					<p class="text-muted mb-0">Todavía no hay jugadores registrados.</p>
				</div>
			</div>
		</div>

		<div class="col-lg-4">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Nuevo jugador</div>
				<div class="card-body">
					<form th:action="@{/jugadores/crear}" method="post">
						<div class="mb-3">
							<label class="form-label" for="nombre">Nombre</label>
							<input class="form-control" id="nombre" name="nombre" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="apellido">Apellido</label>
							<input class="form-control" id="apellido" name="apellido" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="numero">Número de camiseta</label>
							<input class="form-control" id="numero" name="numero" type="number"
								min="1" max="99" value="10" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="posicion">Posición</label>
							<select class="form-select" id="posicion" name="posicion">
								<option>Portero</option>
								<option>Defensa</option>
								<option>Mediocampista</option>
								<option selected>Delantero</option>
							</select>
						</div>
						<button class="btn btn-success w-100" type="submit">Crear jugador</button>
					</form>
				</div>
			</div>
		</div>

	</div>

</main>

<footer th:replace="~{fragmentos :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

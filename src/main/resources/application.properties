# ── Aplicación ──────────────────────────────────────────────
spring.application.name=gestion-equipos

# ── MongoDB ─────────────────────────────────────────────────
# La cadena de conexión NO se guarda en el repositorio (es público).
#   * En local se lee de configuracion-local.properties, que está ignorado por Git.
#   * En la nube (Render) se define la variable de entorno SPRING_MONGODB_URI.
# Si no encuentra ninguna de las dos, cae en un MongoDB local para no arrancar
# con una credencial vacía.
#
# Nota: en Spring Boot 4 la propiedad es spring.mongodb.uri
#       (spring.data.mongodb.uri quedó obsoleta).
spring.config.import=optional:file:./configuracion-local.properties
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/equiposdb}

# Base de datos donde viven las 5 colecciones
# (clubes, entrenadores, jugadores, asociaciones, competiciones)
spring.mongodb.database=equiposdb

# Puerto: en local el 8085 (igual que el EXPOSE del Dockerfile);
# en Render lo impone la variable de entorno PORT.
server.port=${PORT:8085}

# ── Errores más claros en desarrollo ────────────────────────
server.error.include-message=always

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Asociaciones')}"></head>
<body>

<div th:replace="~{fragmentos :: nav}"></div>

<main class="container">

	<h1 class="h3 mb-3">Asociaciones</h1>

	<div class="row g-4">

		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr><th>Id</th><th>Nombre</th><th>País</th><th>Presidente</th><th></th></tr>
						</thead>
						<tbody>
							<tr th:each="a : ${asociaciones}">
								<td th:text="${a.id}">1</td>
								<td class="fw-semibold" th:text="${a.nombre}">Nombre</td>
								<td th:text="${a.pais}">Colombia</td>
								<td th:text="${a.presidente}">Presidente</td>
								<td class="text-end">
									<form th:action="@{/asociaciones/eliminar/{id}(id=${a.id})}"
										method="post"
										onsubmit="return confirm('¿Eliminar esta asociación?');">
										<button class="btn btn-sm btn-outline-danger">Eliminar</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="card-body py-3" th:if="${#lists.isEmpty(asociaciones)}">
					<p class="text-muted mb-0">Todavía no hay asociaciones registradas.</p>
				</div>
			</div>
		</div>

		<div class="col-lg-4">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Nueva asociación</div>
				<div class="card-body">
					<form th:action="@{/asociaciones/crear}" method="post">
						<div class="mb-3">
							<label class="form-label" for="nombre">Nombre</label>
							<input class="form-control" id="nombre" name="nombre"
								placeholder="Federación Colombiana de Fútbol" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="pais">País</label>
							<input class="form-control" id="pais" name="pais"
								placeholder="Colombia" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="presidente">Presidente</label>
							<input class="form-control" id="presidente" name="presidente" required>
						</div>
						<button class="btn btn-success w-100" type="submit">Crear asociación</button>
					</form>
				</div>
			</div>
		</div>

	</div>

</main>

<footer th:replace="~{fragmentos :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('API REST')}"></head>
<body>

<div th:replace="~{fragmentos :: nav}"></div>

<main class="container">

	<h1 class="h3 mb-3">API REST</h1>

	<div class="row g-3 mb-3">

		<div class="col-md-6 col-lg-4">
			<div class="card shadow-sm h-100">
				<div class="card-header fw-semibold">Clubes</div>
				<div class="card-body d-flex flex-wrap gap-2 align-content-start">
					<button class="btn btn-sm btn-primary" data-ruta="/api/clubes">/api/clubes</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/clubes/{id}">/api/clubes/{id}</button>
				</div>
			</div>
		</div>

		<div class="col-md-6 col-lg-4">
			<div class="card shadow-sm h-100">
				<div class="card-header fw-semibold">Relaciones del club</div>
				<div class="card-body d-flex flex-wrap gap-2 align-content-start">
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/clubes/{id}/entrenador">entrenador</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/clubes/{id}/jugadores">jugadores</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/clubes/{id}/asociacion">asociación</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/clubes/{id}/competiciones">competiciones</button>
				</div>
			</div>
		</div>

		<div class="col-md-6 col-lg-4">
			<div class="card shadow-sm h-100">
				<div class="card-header fw-semibold">Catálogos</div>
				<div class="card-body d-flex flex-wrap gap-2 align-content-start">
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/entrenadores">entrenadores</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/jugadores">jugadores</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/asociaciones">asociaciones</button>
					<button class="btn btn-sm btn-outline-primary" data-ruta="/api/competiciones">competiciones</button>
				</div>
			</div>
		</div>

	</div>

	<div class="card shadow-sm">
		<div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
			<span class="fw-semibold">Respuesta</span>
			<span class="d-flex align-items-center gap-2">
				<label class="small text-muted mb-0" for="idClub">Id del club</label>
				<input class="form-control form-control-sm" id="idClub" type="number"
					value="1" min="1" style="width: 5rem;">
			</span>
		</div>
		<div class="card-body">
			<div class="small text-muted mb-2" id="estado">Elige un endpoint para ver su respuesta.</div>
			<pre id="salida"></pre>
		</div>
	</div>

</main>

<footer th:replace="~{fragmentos :: pie}"></footer>

<script>
	var idClub = document.getElementById('idClub');
	var estado = document.getElementById('estado');
	var salida = document.getElementById('salida');

	// Cada botón lleva en data-ruta el endpoint que consulta.
	document.querySelectorAll('[data-ruta]').forEach(function (boton) {
		boton.addEventListener('click', function () {
			consultar(boton.dataset.ruta.replace('{id}', idClub.value));
		});
	});

	async function consultar(ruta) {
		estado.textContent = 'Consultando ' + ruta + ' ...';
		salida.textContent = '';
		try {
			var respuesta = await fetch(ruta, { headers: { 'Accept': 'application/json' } });
			estado.textContent = 'GET ' + ruta + '  ->  ' + respuesta.status + ' ' + respuesta.statusText;
			var texto = await respuesta.text();
			try {
				// Si es JSON válido se muestra con sangría
				salida.textContent = JSON.stringify(JSON.parse(texto), null, 2);
			} catch (error) {
				salida.textContent = texto;
			}
		} catch (error) {
			estado.textContent = 'GET ' + ruta + '  ->  error';
			salida.textContent = error.message;
		}
	}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

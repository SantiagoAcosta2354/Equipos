<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Competiciones')}"></head>
<body>

<div th:replace="~{fragmentos :: nav}"></div>

<main class="container">

	<h1 class="h3 mb-3">Competiciones</h1>

	<div class="row g-4">

		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Competiciones registradas</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr><th>Id</th><th>Nombre</th><th>Premio</th><th>Inicio</th><th>Fin</th><th></th></tr>
						</thead>
						<tbody>
							<tr th:each="c : ${competiciones}">
								<td th:text="${c.id}">1</td>
								<td class="fw-semibold" th:text="${c.nombre}">Nombre</td>
								<td th:text="${c.montoPremio}">0</td>
								<td th:text="${c.fechaInicio}">2026-01-01</td>
								<td th:text="${c.fechaFin}">2026-12-31</td>
								<td class="text-end">
									<form th:action="@{/competiciones/eliminar/{id}(id=${c.id})}"
										method="post"
										onsubmit="return confirm('¿Eliminar esta competición?');">
										<button class="btn btn-sm btn-outline-danger">Eliminar</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="card-body py-3" th:if="${#lists.isEmpty(competiciones)}">
					<p class="text-muted mb-0">Todavía no hay competiciones registradas.</p>
				</div>
			</div>
		</div>

		<div class="col-lg-4">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Nueva competición</div>
				<div class="card-body">
					<form th:action="@{/competiciones/crear}" method="post">
						<div class="mb-3">
							<label class="form-label" for="nombre">Nombre</label>
							<input class="form-control" id="nombre" name="nombre"
								placeholder="Copa Libertadores" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="montoPremio">Monto del premio</label>
							<input class="form-control" id="montoPremio" name="montoPremio"
								type="number" min="0" value="1000000" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="fechaInicio">Fecha de inicio</label>
							<input class="form-control" id="fechaInicio" name="fechaInicio"
								type="date" value="2026-02-01" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="fechaFin">Fecha de fin</label>
							<input class="form-control" id="fechaFin" name="fechaFin"
								type="date" value="2026-11-30" required>
						</div>
						<button class="btn btn-success w-100" type="submit">Crear competición</button>
					</form>
				</div>
			</div>
		</div>

	</div>

</main>

<footer th:replace="~{fragmentos :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

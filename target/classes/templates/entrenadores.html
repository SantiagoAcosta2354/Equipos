<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Entrenadores')}"></head>
<body>

<div th:replace="~{fragmentos :: nav}"></div>

<main class="container">

	<h1 class="h3 mb-3">Entrenadores</h1>

	<div class="row g-4">

		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Entrenadores registrados</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-light">
							<tr><th>Id</th><th>Nombre</th><th>Edad</th><th>Nacionalidad</th><th></th></tr>
						</thead>
						<tbody>
							<tr th:each="e : ${entrenadores}">
								<td th:text="${e.id}">1</td>
								<td class="fw-semibold" th:text="${e.nombre + ' ' + e.apellido}">Nombre</td>
								<td th:text="${e.edad}">45</td>
								<td th:text="${e.nacionalidad}">Colombiana</td>
								<td class="text-end">
									<form th:action="@{/entrenadores/eliminar/{id}(id=${e.id})}"
										method="post"
										onsubmit="return confirm('¿Eliminar este entrenador?');">
										<button class="btn btn-sm btn-outline-danger">Eliminar</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="card-body py-3" th:if="${#lists.isEmpty(entrenadores)}">
					<p class="text-muted mb-0">Todavía no hay entrenadores registrados.</p>
				</div>
			</div>
		</div>

		<div class="col-lg-4">
			<div class="card shadow-sm">
				<div class="card-header fw-semibold">Nuevo entrenador</div>
				<div class="card-body">
					<form th:action="@{/entrenadores/crear}" method="post">
						<div class="mb-3">
							<label class="form-label" for="nombre">Nombre</label>
							<input class="form-control" id="nombre" name="nombre" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="apellido">Apellido</label>
							<input class="form-control" id="apellido" name="apellido" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="edad">Edad</label>
							<input class="form-control" id="edad" name="edad" type="number"
								min="18" max="99" value="45" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="nacionalidad">Nacionalidad</label>
							<input class="form-control" id="nacionalidad" name="nacionalidad"
								placeholder="Colombiana" required>
						</div>
						<button class="btn btn-success w-100" type="submit">Crear entrenador</button>
					</form>
				</div>
			</div>
		</div>

	</div>

</main>

<footer th:replace="~{fragmentos :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
